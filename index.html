<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRAGON BALL BUSINESS TYPE｜あなたの表と裏がわかる交流スタイル診断</title>
<meta name="description" content="ビジネス交流会での「表の顔」と「裏の顔」を、ドラゴンボールのキャラクターで診断。10問・約2分。">
<meta name="theme-color" content="#0a0f2c">
<meta property="og:title" content="DRAGON BALL BUSINESS TYPE｜あなたの表と裏は？">
<meta property="og:description" content="10問であなたの交流スタイルの表と裏がわかる。非公式ファン診断。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="bg-glow g1"></i><i class="bg-glow g2"></i><canvas id="stars"></canvas></div>

<main id="app">
  <!-- START -->
  <section id="screen-start" class="screen active" aria-label="スタート">
    <div class="start-inner">
      <p class="kicker">DRAGON BALL<br><b>BUSINESS TYPE</b></p>
      <div class="orb" aria-hidden="true">
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <defs>
            <radialGradient id="ball" cx="38%" cy="30%" r="80%">
              <stop offset="0" stop-color="#ffe9a0"/><stop offset=".3" stop-color="#ffb02e"/>
              <stop offset=".7" stop-color="#ff7a00"/><stop offset="1" stop-color="#b13a00"/>
            </radialGradient>
            <radialGradient id="shine" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
            <polygon id="st" points="0,-10 2.23,-3.07 9.51,-3.09 3.61,1.17 5.88,8.09 0,3.8 -5.88,8.09 -3.61,1.17 -9.51,-3.09 -2.23,-3.07"/>
          </defs>
          <circle cx="100" cy="100" r="96" fill="url(#ball)"/>
          <g fill="#d1130f" stroke="#7d0500" stroke-width=".6">
            <use href="#st" transform="translate(76 76) scale(2.1)"/>
            <use href="#st" transform="translate(124 76) scale(2.1)"/>
            <use href="#st" transform="translate(76 124) scale(2.1)"/>
            <use href="#st" transform="translate(124 124) scale(2.1)"/>
          </g>
          <ellipse cx="68" cy="52" rx="30" ry="18" fill="url(#shine)" transform="rotate(-30 68 52)"/>
        </svg>
      </div>
      <h1 class="lead" id="start-lead">あなたの表と裏、見てみる？</h1>
      <p class="sub" id="start-sub">あなたの表と裏がわかる交流スタイル診断</p>
      <p class="badge" id="start-badge">10問で診断</p>
      <button class="btn-start" id="btn-start" type="button"><span id="btn-start-label">START</span></button>
      <button class="btn-last" id="btn-last" type="button" hidden>🕘 前回の結果を見る</button>
      <p class="fine" id="start-fine"></p>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="screen-quiz" class="screen" aria-label="質問">
    <div class="quiz-top">
      <button class="btn-back" id="btn-back" type="button" aria-label="前の質問へ">‹ 戻る</button>
      <span class="phase" id="q-phase"></span>
      <span class="count" id="q-count"></span>
    </div>
    <div class="progress" id="q-progress" role="progressbar" aria-valuemin="0" aria-valuemax="10"></div>
    <div id="q-body" class="q-body" aria-live="polite"></div>
  </section>

  <!-- LOADING -->
  <section id="screen-loading" class="screen" aria-label="診断中">
    <div class="loading-inner">
      <div class="charge" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="loading-text" id="loading-text"></p>
    </div>
  </section>

  <!-- RESULT -->
  <section id="screen-result" class="screen" aria-label="診断結果">
    <div id="result"></div>
  </section>
</main>

<script src="data/config.js"></script>
<script src="data/questions.js"></script>
<script src="data/characters.js"></script>
<script src="data/combos.js"></script>
<script src="js/engine.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
</body>
</html>
